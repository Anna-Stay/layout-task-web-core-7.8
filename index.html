<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Menu</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <aside class="mobile-menu">

        <header class="menu-header">
            <div class="menu-header__left">
                <button type="button" class="btn btn--close" aria-label="Закрыть меню">
                    <img src="assets/images/icon.close.svg" alt="Close">
                </button>
                <a href="/" class="menu-header__logo"> 
                    <img src="assets/images/Group.svg" alt="CPS">
                </a>
            </div>
            <div class="menu-header__right">
                <button type="button" class="btn btn--search" aria-label="Поиск">
                    <img src="assets/images/icon.search.svg" alt="Search">
                </button>
            </div>
        </header>

        <nav class="menu-nav">
            <ul class="menu-nav__list">
                                    
                <li class="menu-nav__item menu-nav__item--active"> 
                        <a href="#">Ремонт техники</a></li>
                <li class="menu-nav__item"><a href="#">Услуги и сервисы</a></li>
                <li class="menu-nav__item"><a href="#">Корпоративным клиентам</a></li>
                <li class="menu-nav__item"><a href="#">Продавцам техники</a></li>
                <li class="menu-nav__item"><a href="#">Партнерам</a></li>
                <li class="menu-nav__item"><a href="#">Производителям</a></li>
                <li class="menu-nav__item"><a href="#">Наши сервисные центры</a></li>
                <li class="menu-nav__item"><a href="#">Контакты</a></li>
            </ul>
        </nav>

        <footer class="menu-footer">
            <div class="social">
                <button type="button" class="btn btn--social" aria-label="Позвонить">
                    <img src="assets/images/icon.call.svg" alt="Call">
                </button>
                <button type="button" class="btn btn--social" aria-label="Написать сообщение">
                    <img src="assets/images/icon.chat.svg" alt="Chat">
                </button>
                <button type="button" class="btn btn--social" aria-label="Профиль">
                    <img src="assets/images/icon.profile.svg" alt="Profile">
                </button>   
            </div>
            <a href="mailto:mail@cps.com" class="menu-footer__mail">mail@cps.com</a>
            <a href="tel:88008908900" class="menu-footer__phone">8 800 890 8900</a>
            <div class="menu-footer__language">
                <button type="button" class="active">RU</button>
                <button type="button">EN</button>
                <button type="button">CH</button>
            </div>
        </footer>

    </aside>
</body>
</html>
